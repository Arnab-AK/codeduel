[pytest]
; We only ever write function-based tests, never test classes -- this stops
; pytest from mistaking dataclasses like TestCaseInput/TestCaseOutcome
; (execution/sandbox.py) for test classes just because their name starts
; with "Test".
python_classes =
; Matchmaking tests are async (they call the async queue/matchmaker
; functions directly against real Redis). Auto mode runs any `async def
; test_*` and async fixture without needing `@pytest.mark.asyncio` on each
; one.
asyncio_mode = auto
; app/core/redis_client.py holds one connection pool for the whole process
; (correct for the real app, which has exactly one event loop for its whole
; life). pytest-asyncio's default is a fresh event loop PER TEST FUNCTION,
; which orphans that pool's connections against a now-closed loop after the
; first test -- surfacing on Windows as "Event loop is closed" inside
; asyncio's proactor. Sharing one event loop for the whole session matches
; how the client is actually used in production and avoids the mismatch.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
